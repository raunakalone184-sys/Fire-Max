<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FIRE MAX 3.0 | RK INTERACTIVE</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#080d19;
 color:white;
 font-family:Arial,sans-serif;
 text-align:center;
}
button{
 background:linear-gradient(45deg,#ff3c00,#ff9d00);
 color:white;
 border:0;
 padding:13px 25px;
 border-radius:9px;
 font-size:17px;
 font-weight:bold;
 margin:8px;
 cursor:pointer;
}
input{
 padding:13px;
 border-radius:8px;
 border:2px solid orange;
 background:#111827;
 color:white;
 width:80%;
 max-width:300px;
 font-size:16px;
}
.screen{display:none;padding:25px 12px}
#home{display:block;padding-top:12vh}
.logo{
 font-size:48px;
 font-weight:1000;
 color:#ff5b00;
 text-shadow:0 0 25px orange;
}
.brand{letter-spacing:5px;color:#aaa}
.panel{
 background:#151e30;
 padding:20px;
 border-radius:15px;
 max-width:500px;
 margin:20px auto;
 border:1px solid #39465e;
}
.hero{font-size:75px;margin:15px}
.menu{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:10px;
 max-width:500px;
 margin:auto;
}
.menu button{margin:0}
canvas{
 width:100%;
 max-width:700px;
 height:auto;
 background:#172b32;
 border:3px solid orange;
 border-radius:12px;
 touch-action:none;
}
#controls{
 display:flex;
 justify-content:center;
 gap:20px;
 margin-top:12px;
}
.pad{
 width:65px;height:65px;
 border-radius:50%;
 font-size:25px;
 padding:0;
}
.small{color:#aaa;font-size:13px}
</style>
</head>

<body>

<section id="home" class="screen">
 <div class="brand">RK INTERACTIVE PRESENTS</div>
 <div class="logo">FIRE MAX</div>
 <h3>VERSION 3.0</h3>
 <div class="panel">
  <div class="hero">🪖</div>
  <h2>ENTER THE BATTLE</h2>
  <input id="playerName" placeholder="Enter Player Name">
  <br><br>
  <button onclick="login()">CREATE PLAYER</button>
  <button onclick="guest()">PLAY AS GUEST</button>
 </div>
 <p class="small">Created by Raunak Alone</p>
</section>

<section id="lobby" class="screen">
 <div class="brand">RK INTERACTIVE</div>
 <div class="logo">FIRE MAX</div>
 <div class="panel">
  <h2>WELCOME, <span id="username">PLAYER</span></h2>
  <div class="hero">🪖</div>
  <h3>SELECT YOUR MODE</h3>
  <div class="menu">
   <button onclick="startGame()">TRAINING</button>
   <button onclick="startGame()">BATTLE ARENA</button>
   <button onclick="startGame()">TARGET PRACTICE</button>
   <button onclick="startGame()">FREE MODE</button>
  </div>
 </div>
 <button onclick="startGame()">🔥 START GAME</button>
 <p class="small">Demo version • Single player</p>
</section>

<section id="game" class="screen">
 <h2
